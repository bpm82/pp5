<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>G館AR｜石のアートを取り戻せ</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #fff8e8;
      --paper: #f4ead2;
      --wine: #742d3a;
      --gold: #d7a84a;
      --green: #183d38;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070b13;
    }

    body > video {
      position: fixed !important;
      inset: 0 !important;
      z-index: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
    }

    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      z-index: 1 !important;
    }

    button,
    input { font: inherit; }

    .scan-card,
    .puzzle-card,
    .answer-panel {
      position: fixed;
      left: 50%;
      z-index: 20;
      width: min(calc(100% - 24px), 430px);
      transform: translateX(-50%);
      border: 1px solid rgba(255, 255, 255, .16);
      box-shadow: 0 14px 38px rgba(0, 0, 0, .28);
      backdrop-filter: blur(9px);
    }

    .scan-card,
    .puzzle-card {
      top: max(14px, env(safe-area-inset-top));
      padding: 15px 17px;
      color: var(--ink);
      background: rgba(9, 17, 25, .84);
      border-radius: 17px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #f1c66e;
      font-size: .74rem;
      font-weight: 900;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0 0 7px;
      font-size: 1.12rem;
    }

    .scan-card p,
    .puzzle-card p {
      margin: 0;
      font-size: .9rem;
      line-height: 1.55;
    }

    .puzzle-layer {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: none;
      background: linear-gradient(180deg, rgba(5, 8, 15, .14), rgba(5, 8, 15, .34));
    }

    .puzzle-layer.is-visible { display: block; }

    .drag-zone {
      position: absolute;
      inset: 126px 0 184px;
      z-index: 18;
      cursor: grab;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .drag-zone.is-dragging { cursor: grabbing; }

    .drag-hint {
      position: absolute;
      left: 50%;
      bottom: 184px;
      z-index: 19;
      transform: translateX(-50%);
      padding: 8px 13px;
      color: var(--ink);
      background: rgba(10, 18, 25, .78);
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 999px;
      font-size: .82rem;
      white-space: nowrap;
      pointer-events: none;
    }

    .answer-panel {
      bottom: max(14px, env(safe-area-inset-bottom));
      padding: 14px;
      color: var(--ink);
      background: rgba(9, 17, 25, .9);
      border-radius: 17px;
    }

    .answer-panel label {
      display: block;
      margin-bottom: 8px;
      text-align: center;
      font-weight: 800;
    }

    .answer-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .answer-input {
      min-width: 0;
      padding: 12px 13px;
      color: #231c24;
      background: rgba(255, 255, 255, .97);
      border: 2px solid transparent;
      border-radius: 11px;
      font-size: 16px;
      outline: none;
    }

    .answer-input:focus { border-color: var(--gold); }

    .answer-button,
    .back-button,
    .skip-ar-button {
      padding: 12px 16px;
      color: var(--ink);
      background: linear-gradient(180deg, #8f3d4c, var(--wine));
      border: 1px solid #5d202b;
      border-radius: 11px;
      font-weight: 850;
    }

    .answer-feedback {
      min-height: 2.6em;
      margin: 8px 2px 0;
      font-size: .84rem;
      line-height: 1.45;
      text-align: center;
    }

    .clear-layer {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(5, 8, 14, .72);
      backdrop-filter: blur(7px);
    }

    .clear-layer.is-visible { display: grid; }

    .clear-card {
      width: min(100%, 420px);
      padding: 25px 21px;
      color: #2b2329;
      background: var(--paper);
      border: 3px double #9a7432;
      border-radius: 19px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .42);
    }

    .clear-card .eyebrow { color: var(--wine); }
    .clear-card h2 { margin: 0 0 10px; }
    .clear-card p { margin: 0 0 17px; line-height: 1.7; }
    .back-button { width: 100%; }

    .skip-ar-button {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 80;
      width: min(calc(100% - 24px), 430px);
      transform: translateX(-50%);
      font-size: .9rem;
    }

    body.is-fallback { background: #fff; }
    body.is-fallback > video { display: none !important; }
    body.is-fallback .a-canvas { background: #fff !important; }
    body.is-fallback .mindar-ui-overlay { display: none !important; }
    body.is-fallback .puzzle-layer { background: transparent; }
    body.is-fallback .puzzle-card,
    body.is-fallback .answer-panel {
      color: #171717;
      background: rgba(255, 255, 255, .94);
      border-color: rgba(0, 0, 0, .16);
      box-shadow: 0 14px 38px rgba(0, 0, 0, .12);
      backdrop-filter: none;
    }
    body.is-fallback .puzzle-card .eyebrow { color: #7a4e00; }
    body.is-fallback .drag-hint {
      color: #171717;
      background: rgba(255, 255, 255, .94);
      border-color: rgba(0, 0, 0, .18);
    }
    body.is-fallback .answer-feedback { color: #171717; }

    [hidden] { display: none !important; }
  </style>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    if (window.AFRAME) AFRAME.registerComponent("fit-kioku-model", {
      schema: { size: { type: "number", default: 0.43 } },

      init() {
        this.el.addEventListener("model-loaded", () => {
          const mesh = this.el.getObject3D("mesh");
          if (!mesh) return;

          const box = new THREE.Box3().setFromObject(mesh);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());
          const scale = this.data.size / Math.max(size.x, size.y, size.z);

          mesh.scale.setScalar(scale);
          mesh.position.set(
            -center.x * scale,
            -center.y * scale,
            -center.z * scale
          );
        });
      }
    });
  </script>
</head>
<body>
  <section class="scan-card" id="scanCard" aria-live="polite">
    <p class="eyebrow">G BUILDING / RECOVERY CODE</p>
    <h1>G館前の銅像を映してください</h1>
    <p>銅像と台座が画面の中央に入るよう、正面からゆっくり近づけます。</p>
    <p>読み取れない場合も、下のボタンから問題に進めます。</p>
  </section>

  <main class="puzzle-layer" id="puzzleLayer">
    <section class="puzzle-card">
      <p class="eyebrow">STONE ART RECOVERY</p>
      <h1>隠された復元コードを読め</h1>
      <p>模型を左右に回し、ひとつの言葉に見える角度を探してください。</p>
    </section>

    <div class="drag-zone" id="dragZone" aria-label="模型を左右へ回す"></div>
    <div class="drag-hint">← 画面を左右にスワイプ →</div>

    <form class="answer-panel" id="answerForm">
      <label for="answerInput">何と読めた？</label>
      <div class="answer-row">
        <input
          class="answer-input"
          id="answerInput"
          type="text"
          inputmode="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="答えを入力">
        <button class="answer-button" type="submit">答える</button>
      </div>
      <p class="answer-feedback" id="answerFeedback" aria-live="polite"></p>
    </form>
  </main>

  <section class="clear-layer" id="clearLayer" aria-live="polite">
    <div class="clear-card">
      <p class="eyebrow">RECOVERY CODE FOUND</p>
      <h2>「きおく」</h2>
      <p>石のアートの復元コードを見つけた。<br>回収記録を調査端末へ保存しました。</p>
      <button class="back-button" id="backButton" type="button">本編に戻る</button>
    </div>
  </section>

  <button class="skip-ar-button" id="skipArButton" type="button">読み取りをスキップして問題へ</button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets/g-object.mind; autoStart: true; maxTrack: 1; warmupTolerance: 1; missTolerance: 10; filterMinCF: 0.001; filterBeta: 1000; uiScanning: true; uiLoading: true;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
      <a-asset-item id="kiokuAsset" src="./models/kioku.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false">
      <a-entity
        id="puzzleModelHolder"
        visible="false"
        position="0 0 -1.15"
        rotation="0 125 0">
        <a-entity
          id="puzzleModel"
          gltf-model="#kiokuAsset"
          fit-kioku-model="size: 0.43">
        </a-entity>
        <a-entity light="type: ambient; intensity: 1.5"></a-entity>
        <a-entity light="type: directional; intensity: 1.3" position="-1 2 2"></a-entity>
      </a-entity>
    </a-camera>

    <a-entity id="gTarget" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script>
    const ACCEPTED_ANSWERS = new Set(["きおく", "キオク", "記憶", "kioku"]);
    const SUCCESS_KEY = "g-object-ar-success";

    const scanCard = document.getElementById("scanCard");
    const puzzleLayer = document.getElementById("puzzleLayer");
    const puzzleModelHolder = document.getElementById("puzzleModelHolder");
    const dragZone = document.getElementById("dragZone");
    const answerForm = document.getElementById("answerForm");
    const answerInput = document.getElementById("answerInput");
    const answerFeedback = document.getElementById("answerFeedback");
    const clearLayer = document.getElementById("clearLayer");
    const backButton = document.getElementById("backButton");
    const skipArButton = document.getElementById("skipArButton");
    const gTarget = document.getElementById("gTarget");

    let unlocked = false;
    let dragging = false;
    let pointerId = null;
    let lastX = 0;
    let rotationY = 125;
    let wrongAttempts = 0;

    function normalizeAnswer(value) {
      return value.normalize("NFKC").replace(/\s+/g, "").toLowerCase();
    }

    function unlockPuzzle(skipped = false) {
      if (unlocked) return;
      unlocked = true;
      document.body.classList.toggle("is-fallback", skipped);
      scanCard.hidden = true;
      skipArButton.hidden = true;
      puzzleLayer.classList.add("is-visible");
      puzzleModelHolder.setAttribute("visible", "true");
      answerFeedback.textContent = skipped
        ? "読み取りを省略しました。模型を回して、読めた言葉を入力してください。"
        : "銅像の認識が完了しました。模型は銅像から外しても回せます。";
      if (navigator.vibrate) navigator.vibrate(45);
    }

    function applyRotation() {
      puzzleModelHolder.setAttribute("rotation", `0 ${rotationY} 0`);
    }

    dragZone.addEventListener("pointerdown", event => {
      if (!unlocked) return;
      dragging = true;
      pointerId = event.pointerId;
      lastX = event.clientX;
      dragZone.classList.add("is-dragging");
      dragZone.setPointerCapture?.(event.pointerId);
    });

    dragZone.addEventListener("pointermove", event => {
      if (!dragging || event.pointerId !== pointerId) return;
      const deltaX = event.clientX - lastX;
      lastX = event.clientX;
      rotationY += deltaX * 0.55;
      applyRotation();
    });

    function stopDragging(event) {
      if (!dragging || event.pointerId !== pointerId) return;
      dragging = false;
      pointerId = null;
      dragZone.classList.remove("is-dragging");
    }

    dragZone.addEventListener("pointerup", stopDragging);
    dragZone.addEventListener("pointercancel", stopDragging);

    answerForm.addEventListener("submit", event => {
      event.preventDefault();

      const answer = normalizeAnswer(answerInput.value);
      if (!answer) {
        answerFeedback.textContent = "読めた言葉を入力してください。";
        return;
      }

      const isCorrect = [...ACCEPTED_ANSWERS].some(candidate =>
        normalizeAnswer(candidate) === answer
      );

      if (!isCorrect) {
        wrongAttempts += 1;
        answerFeedback.textContent = wrongAttempts === 1
          ? "まだ違うようです。模型を左側から見るように回してみよう。"
          : "形が重なる角度をもう一度探してください。すぐ再入力できます。";
        answerInput.select();
        if (navigator.vibrate) navigator.vibrate(45);
        return;
      }

      localStorage.setItem(SUCCESS_KEY, "true");
      puzzleLayer.classList.remove("is-visible");
      clearLayer.classList.add("is-visible");
      if (navigator.vibrate) navigator.vibrate([60, 40, 100]);
    });

    backButton.addEventListener("click", () => { location.href = "../index.html"; });

    gTarget.addEventListener("targetFound", () => unlockPuzzle(false));

    gTarget.addEventListener("targetLost", () => {
      if (!unlocked) scanCard.hidden = false;
    });

    skipArButton.addEventListener("click", () => unlockPuzzle(true));

    applyRotation();
  </script>
</body>
</html>
