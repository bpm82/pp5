<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>エラーが連続して出る演出</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      background: #edf1f3;
      color: #213745;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    }
    main { width: min(100%, 430px); padding: 12px 12px 28px; text-align: center; }
    h1 { margin: 0 0 3px; font-size: 1.04rem; }
    .hint { margin: 0 0 9px; color: #61707a; font-size: .8rem; }
    .screen {
      position: relative;
      width: min(100%, 390px);
      aspect-ratio: 390 / 844;
      margin: auto;
      overflow: hidden;
      border: 4px solid #344b58;
      border-radius: 29px;
      background: #fff;
      box-shadow: 0 16px 35px #273d4a30;
      isolation: isolate;
    }
    .popup {
      position: absolute;
      width: 80%;
      margin: 0;
      opacity: 0;
      filter: drop-shadow(0 9px 12px #2d52634f);
      transform-origin: center center;
    }
    .popup[hidden] { display: none; }
    .popup img { display: block; width: 100%; height: auto; }
    .popup:nth-child(1) { --turn: -6deg; z-index: 4; top: 6%; left: 11%; transform: rotate(var(--turn)); }
    .popup:nth-child(2) { --turn: 5deg; z-index: 3; top: 15%; left: 3%; transform: rotate(var(--turn)); }
    .popup:nth-child(3) { --turn: -4deg; z-index: 2; top: 25%; left: 16%; transform: rotate(var(--turn)); }
    .popup:nth-child(4) { --turn: 1deg; z-index: 1; top: 35%; left: 9%; transform: rotate(var(--turn)); }
    .confirm {
      position: absolute;
      top: 70%;
      left: 57%;
      width: 29%;
      height: 16%;
      padding: 0;
      border: 0;
      border-radius: 14px;
      background: transparent;
      cursor: pointer;
    }
    .confirm:disabled { pointer-events: none; }
    .confirm:focus-visible { outline: 3px solid #143f73; outline-offset: 3px; }
    .screen.playing .popup { animation: burst .42s cubic-bezier(.19, 1.28, .32, 1) both; }
    .screen.playing .popup:nth-child(4) { animation-delay: .12s; }
    .screen.playing .popup:nth-child(3) { animation-delay: .42s; }
    .screen.playing .popup:nth-child(2) { animation-delay: .72s; }
    .screen.playing .popup:nth-child(1) { animation-delay: 1.02s; }
    @keyframes burst {
      0% { opacity: 0; transform: rotate(var(--turn)) scale(.42); filter: drop-shadow(0 0 0 transparent) blur(5px); }
      65% { opacity: 1; transform: rotate(var(--turn)) scale(1.09); filter: drop-shadow(0 13px 14px #2d526366) blur(0); }
      100% { opacity: 1; transform: rotate(var(--turn)) scale(1); filter: drop-shadow(0 9px 12px #2d52634f) blur(0); }
    }
    .replay {
      min-width: 190px;
      min-height: 46px;
      margin-top: 13px;
      padding: 9px 18px;
      border: 2px solid #255e68;
      border-radius: 999px;
      background: #fff;
      color: #205c65;
      font: 800 .95rem/1.2 inherit;
      cursor: pointer;
    }
    .replay:focus-visible { outline: 3px solid #dc705b; outline-offset: 3px; }
    .note { margin: 8px 0 0; color: #63727a; font-size: .73rem; }
    body.from-start { background: #e9f5fb url("../Assets/ui/opening-campus-background.png") center center / cover no-repeat; }
    .from-start main { width: min(100%, 430px); min-height: 100dvh; padding: 0; }
    .from-start h1, .from-start .hint, .from-start .replay, .from-start .note { display: none; }
    .from-start .screen { width: 100%; height: 100dvh; aspect-ratio: auto; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    @media (max-width: 450px) {
      main { padding: 8px 7px 15px; }
      .screen { width: min(100%, calc((100dvh - 116px) * 390 / 844)); }
      .from-start main { padding: 0; }
      .from-start .screen { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .screen.playing .popup { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main>
    <h1>エラーが連続して出る演出</h1>
    <p class="hint">背景画像なし・下から上へ警告窓が4枚</p>
    <div class="screen" id="screen" role="group" aria-label="エラー窓が四つ続けて現れる試作">
      <figure class="popup"><img src="../Assets/ui/error-popup-reference-style.png" alt="エラー画面"><button class="confirm" type="button" aria-label="手前のエラーを確認して閉じる" disabled></button></figure>
      <figure class="popup"><img src="../Assets/ui/error-popup-reference-style.png" alt="エラー画面"><button class="confirm" type="button" aria-label="手前のエラーを確認して閉じる" disabled></button></figure>
      <figure class="popup"><img src="../Assets/ui/error-popup-reference-style.png" alt="エラー画面"><button class="confirm" type="button" aria-label="手前のエラーを確認して閉じる" disabled></button></figure>
      <figure class="popup"><img src="../Assets/ui/error-popup-reference-style.png" alt="エラー画面"><button class="confirm" type="button" aria-label="手前のエラーを確認して閉じる" disabled></button></figure>
    </div>
    <button class="replay" id="replay" type="button">もう一度見る ↻</button>
    <p class="note">手前の「確認する」を押すと、その窓が一枚消えます。</p>
  </main>
  <script>
    const entry = new URLSearchParams(location.search);
    const fromStory = entry.has('fromStory');
    if (entry.has('fromStart') || fromStory) document.body.classList.add('from-start');
    const screen = document.getElementById('screen');
    const popups = [...screen.querySelectorAll('.popup')];
    const confirms = popups.map(popup => popup.querySelector('.confirm'));
    let front = 0;
    let readyTimer;
    confirms.forEach((button, index) => button.addEventListener('click', () => {
      if (index !== front) return;
      popups[index].hidden = true;
      button.disabled = true;
      front += 1;
      if (front < confirms.length) confirms[front].disabled = false;
      else if (fromStory) setTimeout(() => { location.href = './index.html?afterError=1'; }, 280);
    }));
    function replay() {
      clearTimeout(readyTimer);
      front = 0;
      popups.forEach((popup, index) => {
        popup.hidden = false;
        confirms[index].disabled = true;
      });
      screen.classList.remove('playing');
      void screen.offsetWidth;
      screen.classList.add('playing');
      const wait = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1500;
      readyTimer = setTimeout(() => { confirms[0].disabled = false; }, wait);
    }
    document.getElementById('replay').addEventListener('click', replay);
    replay();
  </script>
</body>
</html>
