<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10271e">
  <title>怪盗からの挑戦状 ―バーチャルD館盗難事件―</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: #10271e url("../Assets/ui/formal-title-detective-background.png") center center / cover no-repeat;
    }
    main {
      width: min(100%, 620px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(30px, env(safe-area-inset-top)) 14px max(26px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      display: block;
      width: 100%;
      height: auto;
      margin-top: clamp(80px, 19dvh, 190px);
    }
    .start {
      display: block;
      width: min(76%, 350px);
      margin-top: auto;
      margin-bottom: clamp(65px, 11dvh, 115px);
      cursor: pointer;
      transition: transform .12s ease;
    }
    .start img { display: block; width: 100%; height: auto; }
    .start:active { transform: translateY(4px) scale(.98); }
    .start:focus-visible { outline: 3px solid #fff1ba; outline-offset: 4px; border-radius: 999px; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="../Assets/ui/phantom-challenge-logo-a-detective-v2.png" alt="怪盗からの挑戦状 ―バーチャルD館盗難事件―">
    <a class="start" href="./index.html?afterTitle=1" aria-label="捜査を始める"><img src="../Assets/ui/formal-title-start-button.png" alt=""></a>
  </main>
</body>
</html>
